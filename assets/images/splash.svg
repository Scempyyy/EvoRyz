<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1284 2778" width="1284" height="2778">
  <defs>
    <radialGradient id="splashBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#18142B"/>
      <stop offset="45%" stop-color="#0C0A15"/>
      <stop offset="100%" stop-color="#06050B"/>
    </radialGradient>
    <linearGradient id="wingLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#3A7BD5"/>
      <stop offset="100%" stop-color="#6B11F4"/>
    </linearGradient>
    <linearGradient id="wingRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B11F4"/>
      <stop offset="60%" stop-color="#9A4BFF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="crestCenter" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="apexGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1284" height="2778" fill="url(#splashBg)"/>
  <circle cx="642" cy="1200" r="450" fill="#6B11F4" opacity="0.12" filter="url(#glow)"/>

  <!-- Centered emblem -->
  <g transform="translate(382, 940) scale(0.5)">
    <path d="M 270 700 L 430 380 L 512 470 L 400 660 Z" fill="url(#wingLeft)"/>
    <path d="M 400 660 L 512 470 L 470 540 L 360 710 Z" fill="#13102B" opacity="0.45"/>
    <path d="M 512 210 L 754 660 L 640 700 L 512 460 Z" fill="url(#wingRight)"/>
    <path d="M 512 280 L 600 480 L 512 600 L 424 480 Z" fill="url(#crestCenter)"/>
    <polygon points="512,170 528,226 584,242 528,258 512,314 496,258 440,242 496,226" fill="url(#apexGlow)" filter="url(#glow)"/>
    <circle cx="512" cy="242" r="8" fill="#FFFFFF"/>
  </g>

  <!-- Brand Typography -->
  <text x="642" y="1460" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="900" font-size="76" letter-spacing="-2" fill="#FFFFFF">Evo<tspan fill="#A78BFA">Ryz</tspan></text>
  <text x="642" y="1520" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="600" font-size="28" letter-spacing="4" fill="#94A3B8">EVOLVE · RISE · REPEAT</text>
</svg>
