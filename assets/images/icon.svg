<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1B172E"/>
      <stop offset="60%" stop-color="#0E0C18"/>
      <stop offset="100%" stop-color="#08070F"/>
    </radialGradient>
    <linearGradient id="wingLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#3A7BD5"/>
      <stop offset="100%" stop-color="#6B11F4"/>
    </linearGradient>
    <linearGradient id="wingRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B11F4"/>
      <stop offset="60%" stop-color="#9A4BFF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="crestCenter" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="apexGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)"/>
  <rect width="1016" height="1016" x="4" y="4" rx="220" fill="none" stroke="#2D2845" stroke-width="4" opacity="0.6"/>

  <!-- Subtle ambient inner aura -->
  <circle cx="512" cy="490" r="320" fill="#6B11F4" opacity="0.12" filter="url(#glow)"/>
  <circle cx="512" cy="440" r="200" fill="#00D2FF" opacity="0.08" filter="url(#glow)"/>

  <!-- The Rising Mark -->
  <g filter="url(#subtleShadow)">
    <!-- Left Ascending Facet (Evolution) -->
    <path d="M 270 700
             L 430 380
             L 512 470
             L 400 660
             Z"
          fill="url(#wingLeft)"/>

    <!-- Left Wing Shadow Accent -->
    <path d="M 400 660
             L 512 470
             L 470 540
             L 360 710
             Z"
          fill="#13102B" opacity="0.45"/>

    <!-- Right Ascending Facet (Rise Peak) -->
    <path d="M 512 210
             L 754 660
             L 640 700
             L 512 460
             Z"
          fill="url(#wingRight)"/>

    <!-- Central Rising Core Chevron -->
    <path d="M 512 280
             L 600 480
             L 512 600
             L 424 480
             Z"
          fill="url(#crestCenter)"/>

    <!-- Apex Luminescence Spark -->
    <polygon points="512,170 528,226 584,242 528,258 512,314 496,258 440,242 496,226"
             fill="url(#apexGlow)" filter="url(#glow)"/>
    <circle cx="512" cy="242" r="8" fill="#FFFFFF"/>
  </g>
</svg>
